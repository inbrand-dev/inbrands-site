<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta name="theme-color" content="#0f172a" />
  <title>Snapshot Loader · Orion Hub</title>
  <style>
    :root{--bg:#0b1020;--panel:#111a2a;--border:#26364e;--text:#f4f8ff;--muted:#97a7bd;--accent:#6ee7b7;--danger:#fca5a5}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:linear-gradient(180deg,#0b1020,#0d1425)}
    main{width:min(100% - 20px,620px);margin:0 auto;padding:24px 0}
    a{color:var(--muted)}
    .card{margin-top:18px;padding:20px;border:1px solid var(--border);border-radius:20px;background:var(--panel)}
    .eyebrow{margin:0 0 6px;color:var(--accent);font-size:.72rem;font-weight:850;letter-spacing:.1em;text-transform:uppercase}
    h1{margin:0;font-size:2rem;letter-spacing:-.04em}
    .muted{color:var(--muted);line-height:1.45}
    label{display:block;margin:18px 0 7px;font-weight:800}
    input[type=file]{width:100%;padding:12px;border:1px solid var(--border);border-radius:12px;background:#0f172a;color:var(--text)}
    button{width:100%;min-height:48px;margin-top:14px;border:1px solid rgba(110,231,183,.35);border-radius:13px;background:var(--accent);color:#082019;font:inherit;font-weight:900;cursor:pointer}
    button:disabled{opacity:.45;cursor:not-allowed}
    pre{white-space:pre-wrap;word-break:break-word;margin:14px 0 0;padding:12px;border:1px solid var(--border);border-radius:12px;background:#0b1323;color:var(--muted);font-size:.82rem}
    .error{color:var(--danger)}
    .ok{color:#bbf7d0}
  </style>
</head>
<body>
  <main>
    <a href="../">← Dashboard</a>
    <section class="card">
      <p class="eyebrow">Authenticated utility</p>
      <h1>Snapshot Loader</h1>
      <p class="muted">Loads a prepared canonical snapshot into Orion Hub. This page does not edit project data.</p>
      <label for="file">Snapshot JSON</label>
      <input id="file" type="file" accept=".json,application/json" />
      <pre id="preview">Choose a snapshot file.</pre>
      <button id="import" type="button" disabled>Import canonical snapshot</button>
      <pre id="result" hidden></pre>
    </section>
  </main>
  <script type="module" src="import.js"></script>
</body>
</html>
